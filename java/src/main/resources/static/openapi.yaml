openapi: 3.0.3
info:
  title: XA Bank Time Deposit API
  version: "1.0"
  description: Time deposits of XA Bank and the monthly interest credited to them.
tags:
  - name: TimeDeposits
paths:
  /time-deposits:
    get:
      tags: [TimeDeposits]
      operationId: getAllTimeDeposits
      summary: All time deposits with their withdrawals
      responses:
        "200":
          description: Every time deposit in the database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeDepositList"
  /time-deposits/update-balances:
    post:
      tags: [TimeDeposits]
      operationId: updateAllBalances
      summary: Credit one month of interest to every time deposit
      description: >
        Applies the plan's monthly interest to each deposit and stores the new balances.
        Each call credits another month, so the operation is not idempotent and uses POST (A1).
        The updated deposits are returned so the effect is visible immediately (A7).
      responses:
        "200":
          description: Every time deposit with its updated balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeDepositList"
components:
  schemas:
    TimeDepositList:
      type: array
      items:
        $ref: "#/components/schemas/TimeDepositResponse"
    TimeDepositResponse:
      type: object
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        planType:
          type: string
          example: premium
        balance:
          type: number
          description: Current balance in currency units, two decimals
          example: 1004.17
        days:
          type: integer
          format: int32
          description: Age of the deposit in days
          example: 46
        withdrawals:
          type: array
          items:
            $ref: "#/components/schemas/WithdrawalResponse"
    WithdrawalResponse:
      type: object
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
          example: 10
        amount:
          type: number
          description: Withdrawn amount in currency units, two decimals
          example: 25.00
        date:
          type: string
          format: date
          example: "2024-05-01"
